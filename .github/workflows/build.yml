# DO NOT TOUCH unless the build itself changes (new JDK, new Gradle task).
# Builds the robot app on every push and pull request, so a commit that doesn't compile
# shows a red X on GitHub before anyone tries to deploy it at a match.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The Android Gradle Plugin needs JDK 17 or 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build TeamCode
        run: ./gradlew :TeamCode:assembleDebug --console=plain
